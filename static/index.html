<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Turkish Chat Moderation</title>
  <style>
    :root { color-scheme: light; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #151f2c; background: #f3f4f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1050px; margin: auto; padding: clamp(28px, 6vw, 74px) 22px; }
    h1 { margin: 0 0 26px; font-size: clamp(1.8rem, 4.2vw, 3rem); letter-spacing: -.05em; }
    h2 { font-size: 1.12rem; margin: 0; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(230px, .46fr); gap: 18px; align-items: start; }
    .card { background: white; border: 1px solid #d7dddc; border-radius: 16px; }
    .head { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid #e6e9e8; }
    button, select, textarea { font: inherit; }
    button, select { cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    .clear { padding: 6px; background: transparent; border: 0; color: #34584e; }
    .log { min-height: 230px; max-height: 380px; overflow-y: auto; padding: 16px 20px; }
    .message { padding: 12px 14px; background: #f2f6f4; border-radius: 12px 12px 12px 2px; margin: 0 0 10px; }
    .message p { margin: 0 0 6px; overflow-wrap: anywhere; white-space: pre-wrap; }
    .message.flag { background: #fbefec; }
    .meta, .empty, .timing small { color: #526062; font-size: .84rem; }
    .empty { line-height: 1.5; }
    form { border-top: 1px solid #e6e9e8; padding: 16px 20px 20px; }
    label { display: block; font-weight: 650; font-size: .88rem; margin-bottom: 8px; }
    textarea, select { border: 1px solid #aab9b4; border-radius: 8px; color: #182823; background: white; }
    textarea { width: 100%; resize: vertical; padding: 12px; min-height: 78px; }
    .send { display: block; margin: 10px 0 0 auto; padding: 9px 22px; color: white; font-weight: 650; border: 0; border-radius: 8px; background: #185447; }
    .examples { min-inline-size: 0; margin: 18px 0 0; padding: 0; border: 0; }
    .examples legend { padding: 0; margin-bottom: 8px; font-size: .88rem; font-weight: 650; }
    .example-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .example-list button { padding: 6px 10px; border: 1px solid #bdcec6; border-radius: 8px; background: #f4f8f5; color: #234b40; text-align: start; }
    .example-list button:enabled:hover { background: #e5f0e9; border-color: #729685; }
    .panel { padding: 20px; }
    select { width: 100%; padding: 10px 6px; }
    .panel h2 { margin: 24px 0 0; border-top: 1px solid #e6e9e8; padding-top: 18px; }
    ol { padding: 0; margin: 8px 0 0; list-style: none; max-height: 370px; overflow-y: auto; }
    .timing { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 10px 0; border-bottom: 1px solid #e6e9e8; }
    .timing b { font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .9rem; }
    #error { color: #9a3722; margin: 8px 0 0; font-size: .88rem; }
    :focus-visible { outline: 3px solid #568d7d; outline-offset: 2px; }
    @media (max-width: 680px) { .layout { grid-template-columns: 1fr; } .log { min-height: 120px; } }
  </style>
</head>
<body>
<main>
  <h1>Turkish Chat Moderation</h1>
  <div class="layout">
    <section class="card" aria-label="Chat">
      <div class="head"><h2>Chat</h2><button class="clear" id="clear" disabled>Clear chat</button></div>
      <div id="messages" class="log" role="log" aria-live="polite"><p class="empty">Send a Turkish message to see how the model classifies it.</p></div>
      <form id="composer" novalidate>
        <label for="text">Your message</label>
        <textarea id="text" maxlength="1500" required placeholder="Type a message in Turkish…"></textarea>
        <p role="alert" id="error" hidden></p>
        <button class="send" id="send">Send</button>
        <fieldset class="examples" id="examples">
          <legend>Examples</legend>
          <div class="example-list" lang="tr">
            <button type="submit" name="example">Herkese iyi oyunlar!</button>
            <button type="submit" name="example">Sen bir aptalsın</button>
            <button type="submit" name="example">Ona aptal demen hiç hoş değil</button>
          </div>
        </fieldset>
      </form>
    </section>
    <aside class="card panel">
      <label for="model">Moderation model</label>
      <select id="model">
        <!-- MODEL_OPTIONS -->
      </select>
      <h2>Response and CPU times</h2>
      <p id="no-times" class="empty">Each message shows the total response time and the time spent on CPU inference.</p>
      <ol id="times" aria-label="Response and CPU times for each message"></ol>
    </aside>
  </div>
</main>
<script>
  const el = id => document.getElementById(id);
  const modelNames = Object.fromEntries(Array.from(el("model").options, option =>
    [option.value, option.dataset.short]));
  const percent = new Intl.NumberFormat("en-US", { style: "percent", maximumFractionDigits: 1 });
  const duration = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 3 });
  let count = 0;
  const element = (tag, text, className) => {
    const node = document.createElement(tag);
    node.textContent = text;
    if (className) node.className = className;
    return node;
  };
  function render(result, responseMs) {
    if (!count) el("messages").replaceChildren();
    count++;
    const message = element("article", "", result.flagged ? "message flag" : "message");
    const scoreName = result.score_kind === "heuristic" ? "Rule score" : "Model confidence";
    let score = scoreName + " " + percent.format(result.confidence);
    if (typeof result.decision_threshold === "number") {
      score += " · Offensive probability " + percent.format(result.offensive_probability)
        + " (threshold " + percent.format(result.decision_threshold) + ")";
    }
    const label = result.flagged ? "Offensive" : "Clean";
    message.append(element("p", result.text),
      element("span", "#" + count + " · " + label + " · " + score, "meta"));
    el("messages").append(message);
    el("messages").scrollTop = el("messages").scrollHeight;
    el("no-times").hidden = true;
    const timeRow = element("li", "", "timing");
    const detail = element("div", "");
    detail.append(element("b", duration.format(responseMs) + " ms"),
      document.createElement("br"), element("small", "CPU " + duration.format(result.latency_ms) + " ms"));
    timeRow.append(element("small", "#" + count + " · " + modelNames[result.model]), detail);
    el("times").prepend(timeRow);
  }
  function reset() {
    count = 0;
    el("messages").replaceChildren(element("p", "Send a Turkish message to see how the model classifies it.", "empty"));
    el("times").replaceChildren();
    el("no-times").hidden = false;
    el("clear").disabled = true;
    el("error").hidden = true;
  }
  el("clear").addEventListener("click", reset);
  el("composer").addEventListener("submit", async event => {
    event.preventDefault();
    const input = el("text");
    if (el("send").disabled) return;
    const example = event.submitter?.name === "example" ? event.submitter : null;
    const text = (example ? example.textContent : input.value).trim();
    if (!text) {
      el("error").textContent = "Enter a Turkish message.";
      el("error").hidden = false;
      input.focus();
      return;
    }
    el("error").hidden = true;
    el("send").disabled = true;
    el("examples").disabled = true;
    el("send").textContent = "Checking…";
    input.readOnly = true;
    el("clear").disabled = true;
    try {
      const started = performance.now();
      const response = await fetch("/predict", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: el("model").value, text }) });
      if (!response.ok) {
        const body = await response.json();
        throw new Error(typeof body.detail === "string" ? body.detail : "Could not process this message.");
      }
      const result = await response.json();
      const responseMs = performance.now() - started;
      if (!example) input.value = "";
      render(result, responseMs);
    } catch (error) {
      el("error").textContent = error instanceof TypeError ? "Could not reach the app." :
        (error.message || "Could not process this message.");
      el("error").hidden = false;
    } finally {
      el("send").disabled = false;
      el("examples").disabled = false;
      el("send").textContent = "Send";
      input.readOnly = false;
      el("clear").disabled = count === 0;
      if (!example) input.focus();
      else if (document.activeElement === document.body) example.focus({ preventScroll: true });
    }
  });
  el("text").addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
      event.preventDefault();
      el("composer").requestSubmit();
    }
  });
</script>
</body>
</html>
